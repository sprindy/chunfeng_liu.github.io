title: Chunfeng Liu
description: Technology leader and Nanyang MBA candidate studying AI infrastructure and product strategy.
url: https://sprindy.github.io
baseurl: '/chunfeng_liu.github.io'
timezone: Asia/Singapore
permalink: /blog/:title/
collections:
  work:
    output: true
    permalink: /work/:name/
defaults:
  - scope:
      path: ''
      type: work
    values:
      layout: article
  - scope:
      path: ''
      type: posts
    values:
      layout: article
exclude: [README.md, AGENTS.md, Gemfile, Gemfile.lock, vendor, _analytics]

# Set to the deployed Worker URL to enable the analytics preferences on the site.
visitor_analytics_url: 'https://chunfeng-portfolio-analytics.sprindy-liu.workers.dev/'
