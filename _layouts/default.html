<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#081e29">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.github.build_revision | default: 'section-navigation' | escape }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">Chunfeng Liu<span>.</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a href="{{ '/' | relative_url }}#skills">Skills</a>
      <a href="{{ '/' | relative_url }}#work">Work</a>
      <a href="{{ '/' | relative_url }}#blog">Blog</a>
      <a href="{{ '/' | relative_url }}#education">Education</a>
      <a href="{{ '/' | relative_url }}#hobbies">Hobbies</a>
    </nav>
    <div class="contact" aria-label="Social profiles"><a href="https://www.linkedin.com/in/caleb-liu-6a361011a/">LinkedIn ↗</a><a href="https://github.com/sprindy">GitHub ↗</a><a href="https://www.instagram.com/sprindy.liu/">Instagram ↗</a></div>
  </div></header>
  <main id="main">{{ content }}</main>
  <footer><div class="wrap footer-inner">
    <span>Chunfeng Liu · Singapore</span>
    <div><a href="https://www.linkedin.com/in/caleb-liu-6a361011a/">LinkedIn ↗</a><a href="https://github.com/sprindy">GitHub ↗</a><a href="https://www.instagram.com/sprindy.liu/">Instagram ↗</a></div>
  </div></footer>
</body>
</html>
